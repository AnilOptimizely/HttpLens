name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dashboard dependencies
        working-directory: src/HttpLens.Dashboard/dashboard-ui
        run: npm ci

      - name: Build dashboard
        working-directory: src/HttpLens.Dashboard/dashboard-ui
        run: npm run build

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Test
        run: dotnet test -c Release

      # HttpLens.Abstractions is versioned separately; --skip-duplicate below
      # leaves it alone unless its version was bumped.
      - name: Pack
        run: |
          for p in src/HttpLens/HttpLens.csproj src/HttpLens.Core/HttpLens.Core.csproj src/HttpLens.Dashboard/HttpLens.Dashboard.csproj src/Lens.Abstractions/Lens.Abstractions.csproj; do
            dotnet pack "$p" -c Release -o ./artifacts
          done

      - name: Verify tag matches package version
        run: |
          if [ ! -f "./artifacts/HttpLens.${GITHUB_REF_NAME#v}.nupkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the HttpLens package version:" >&2
            ls ./artifacts >&2
            exit 1
          fi

      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: AnilP

      - name: Push to NuGet
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
